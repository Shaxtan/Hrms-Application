name: hrms_app
description: HRMS Employee Onboarding — Mobile App
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  get: ^4.6.6

  # Networking
  dio: ^5.4.0

  # Local storage
  flutter_secure_storage: ^9.0.0

  # UI
  google_fonts: ^6.1.0
  shimmer: ^3.0.0

  # Image / File
  image_picker: ^1.0.7

  # Date
  intl: ^0.19.0

  # Utils
  logger: ^2.0.2+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
