name: hrms_app
description: HRMS Employee Onboarding — Mobile App
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  get: ^4.6.6

  # Networking
  dio: ^5.4.0

  # Local storage
  flutter_secure_storage: ^9.0.0

  # UI
  google_fonts: ^6.1.0
  shimmer: ^3.0.0

  # Image / File
  image_picker: ^1.0.7

  # Date
  intl: ^0.19.0

  # Utils
  logger: ^2.0.2+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#1A73E8"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
  remove_alpha_ios: false

flutter:
  uses-material-design: true
